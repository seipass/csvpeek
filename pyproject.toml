[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "csvpeek"
version = "0.1.0"
description = "Show CSV headers and a sample of rows."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
[project.scripts]
csvpeek = "csvpeek.cli:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
